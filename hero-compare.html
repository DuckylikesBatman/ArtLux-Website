<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; }

  .label {
    text-align: center;
    padding: 18px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: #111;
    color: #fff;
  }

  /* ── DARK (old) ── */
  .dark-hero {
    position: relative;
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 24px 80px;
    overflow: hidden;
    isolation: isolate;
    background: #0f0d0b;
  }
  .dark-hero__bg {
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
      linear-gradient(90deg, rgba(15,13,11,.92) 0%, rgba(15,13,11,.72) 42%, rgba(15,13,11,.45) 100%),
      radial-gradient(circle at 22% 45%, rgba(200,164,93,.22), transparent 34%),
      linear-gradient(135deg, #15100d 0%, #1d1712 42%, #0f0d0b 100%);
  }
  .dark-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background-image:
      linear-gradient(rgba(247,240,230,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247,240,230,.035) 1px, transparent 1px);
    background-size: 54px 54px;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 82%);
    mask-image: linear-gradient(to bottom, black, transparent 82%);
    pointer-events: none;
  }
  .dark-hero::after {
    content: "";
    position: absolute;
    right: -120px;
    bottom: -170px;
    width: 520px;
    height: 520px;
    z-index: -1;
    border: 1px solid rgba(200,164,93,.22);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ── LIGHT (new) ── */
  .light-hero {
    position: relative;
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 24px 80px;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 80% 25%, rgba(201,163,58,.14), transparent 36%),
      radial-gradient(circle at 14% 70%, rgba(201,163,58,.08), transparent 28%),
      linear-gradient(135deg, #fbf7ee 0%, #f3eadb 48%, #e7d8bd 100%);
  }
  .light-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(17,17,16,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,16,.04) 1px, transparent 1px);
    background-size: 56px 56px;
    pointer-events: none;
  }
  .light-hero::after {
    content: "";
    position: absolute;
    right: -120px;
    bottom: -160px;
    width: 520px;
    height: 520px;
    border: 1px solid rgba(201,163,58,.2);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ── Shared content styles ── */
  .hero-content {
    text-align: center;
    position: relative;
    z-index: 2;
    max-width: 800px;
    width: 100%;
  }

  .eye-dark {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    color: #e2c982;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .eye-dark::before, .eye-dark::after {
    content: "";
    width: 42px; height: 1px;
    background: linear-gradient(90deg, transparent, #c8a45d);
  }
  .eye-dark::after { background: linear-gradient(90deg, #c8a45d, transparent); }

  .eye-light {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    color: #8a7022;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .eye-light::before, .eye-light::after {
    content: "";
    width: 42px; height: 1px;
    background: linear-gradient(90deg, transparent, #a88a2a);
  }
  .eye-light::after { background: linear-gradient(90deg, #a88a2a, transparent); }

  .title-dark {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 6vw, 6rem);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.05em;
    color: #fff;
    margin-bottom: 0;
  }
  .title-dark em { color: #c9a33a; font-style: italic; }

  .title-light {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 6vw, 6rem);
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.05em;
    color: #111110;
    margin-bottom: 0;
  }
  .title-light em { color: #a88a2a; font-style: italic; }

  .sub-dark {
    max-width: 580px;
    margin: 26px auto 0;
    color: rgba(247,240,230,.72);
    font-size: 1.05rem;
    line-height: 1.82;
  }
  .sub-light {
    max-width: 580px;
    margin: 26px auto 0;
    color: #6a6866;
    font-size: 1.05rem;
    line-height: 1.82;
  }

  .divider {
    height: 6px;
    background: #c9a33a;
    text-align: center;
    line-height: 6px;
    font-size: 0.6rem;
    color: #c9a33a;
    letter-spacing: 0.5em;
  }
</style>
</head>
<body>

<div class="label">OLD — Dark Hero</div>
<section class="dark-hero">
  <div class="dark-hero__bg"></div>
  <div class="hero-content">
    <p class="eye-dark">ArtLux Collection</p>
    <h1 class="title-dark">The<br><em>Gallery</em></h1>
    <p class="sub-dark">Original paintings and bespoke artworks by Manal Yehya</p>
  </div>
</section>

<div class="divider"></div>

<div class="label">NEW — Light Hero</div>
<section class="light-hero">
  <div class="hero-content">
    <p class="eye-light">ArtLux Collection</p>
    <h1 class="title-light">The<br><em>Gallery</em></h1>
    <p class="sub-light">Original paintings and bespoke artworks by Manal Yehya</p>
  </div>
</section>

</body>
</html>
