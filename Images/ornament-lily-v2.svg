<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" fill="none">
  <defs>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecd7a0"/>
      <stop offset="45%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8a6530"/>
    </linearGradient>
    <linearGradient id="lg2b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a6530"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
  </defs>

  <!-- stem: tapering filled shape, thick at base, thin at top -->
  <path d="M124 372 C 123 320, 124 268, 122 224 C 121 200, 118 188, 112 176
           L 114 175 C 120 187, 123 199, 124 223 C 126 267, 125 319, 126 372 Z"
        fill="url(#lg2b)"/>

  <!-- small leaf on stem -->
  <path d="M118 250 C 100 244, 82 248, 68 262 C 84 272, 104 270, 118 254
           C 116 253, 117 251, 118 250 Z" fill="url(#lg2b)" opacity="0.92"/>
  <path d="M96 254 C 92 262, 92 270, 96 278" stroke="#f7f0e6" stroke-width="0.8" opacity="0.5" fill="none"/>

  <path d="M112 176 C 104 172, 96 174, 90 182 C 98 188, 108 186, 112 176 Z" fill="url(#lg2b)" opacity="0.9"/>

  <!-- 6 petals, back layer (dimmer, behind) -->
  <g opacity="0.55">
    <path d="M112 176 C 94 148, 84 116, 90 78 C 108 96, 118 128, 116 164 C 115 168, 113 172, 112 176 Z" fill="url(#lg2)"/>
    <path d="M112 176 C 78 168, 48 148, 34 116 C 62 108, 92 118, 110 148 C 112 158, 113 168, 112 176 Z" fill="url(#lg2)"/>
    <path d="M112 176 C 146 168, 176 148, 190 116 C 162 108, 132 118, 114 148 C 112 158, 111 168, 112 176 Z" fill="url(#lg2)"/>
  </g>

  <!-- 6 petals, front layer -->
  <path d="M112 176 C 100 142, 98 106, 112 68 C 126 106, 124 142, 112 176 Z" fill="url(#lg2)"/>
  <path d="M112 176 C 84 158, 58 132, 52 96 C 82 98, 106 120, 116 156 C 115 163, 113 170, 112 176 Z" fill="url(#lg2)"/>
  <path d="M112 176 C 140 158, 166 132, 172 96 C 142 98, 118 120, 108 156 C 109 163, 111 170, 112 176 Z" fill="url(#lg2)"/>
  <path d="M112 176 C 96 154, 84 128, 84 100 C 106 108, 118 130, 118 158 Z" fill="url(#lg2)" opacity="0.9"/>
  <path d="M112 176 C 128 154, 140 128, 140 100 C 118 108, 106 130, 106 158 Z" fill="url(#lg2)" opacity="0.9"/>

  <!-- petal vein detail -->
  <g stroke="#f7f0e6" stroke-width="0.7" opacity="0.55" fill="none">
    <path d="M112 168 C 110 140, 110 108, 112 76"/>
    <path d="M112 168 C 96 150, 76 130, 66 104"/>
    <path d="M112 168 C 128 150, 148 130, 158 104"/>
  </g>

  <!-- stamens -->
  <g stroke="url(#lg2b)" stroke-width="1.3" fill="none">
    <path d="M112 172 C 106 148, 102 122, 106 96"/>
    <path d="M112 172 C 116 148, 118 122, 114 96"/>
    <path d="M112 172 C 96 152, 84 130, 82 106"/>
    <path d="M112 172 C 128 152, 140 130, 142 106"/>
    <path d="M112 172 C 102 156, 96 138, 98 120"/>
  </g>
  <circle cx="105" cy="94" r="3.2" fill="url(#lg2)"/>
  <circle cx="113" cy="94" r="3.2" fill="url(#lg2)"/>
  <circle cx="81" cy="104" r="3.2" fill="url(#lg2)"/>
  <circle cx="142" cy="104" r="3.2" fill="url(#lg2)"/>
  <circle cx="97" cy="119" r="2.8" fill="url(#lg2)"/>
</svg>
